name: Foundation build
on: [push, pull_request, workflow_dispatch]
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev desktop-file-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy && rustup default 1.90.0
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p poseidon-core --lib
      - run: npm run check:release
      - run: npm run check:bindings
      - run: npm run format:check
      - run: npm run build
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: npm run build:desktop -- -- --locked
      # Git integration requires Git >=2.49; Ubuntu 24.04 ships an older Git.
      # Run the full offline suite on the documented Arch environment.
