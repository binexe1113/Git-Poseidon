name: Git-Poseidon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev desktop-file-utils

      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0

      - name: Verify Git version for integration tests
        shell: bash
        run: |
          git --version
          required=2.49
          actual="$(git --version | awk '{print $3}')"
          if [[ "$(printf '%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]]; then
            echo "::error::Git $required or newer is required (found $actual)"
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust unit and integration tests (temporary Git fixtures)
        run: cargo test --locked -p poseidon-core

      - name: Check generated IPC bindings
        run: npm run check:bindings

      - name: Check release configuration
        run: npm run check:release

      - name: Check frontend formatting
        run: npm run format:check

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build Tauri desktop binary (no bundle)
        run: npm run build:desktop -- -- --locked
